name: Deploy public page
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure public backend URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const value=process.env.API_BASE_URL; if(value){ if(new URL(value).protocol!=="https:") throw new Error("API_BASE_URL must use HTTPS"); fs.writeFileSync("docs/config.js", "window.ENDGAME_CONFIG = " + JSON.stringify({apiBaseUrl:value}) + ";\n"); }'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
